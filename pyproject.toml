[project]
name = "seedbox-mcp"
version = "0.1.0"
description = "MCP server for Seedbox management"
requires-python = ">=3.13"
dependencies = [
    "mcp[server]>=1.2.1",
    "deluge-client>=1.10.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "starlette>=0.45.3",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
